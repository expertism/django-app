<div class="nav">
  {% load static %}
  <input type="checkbox" id="nav-check" />
  <div class="nav-header">
    <a href="{% url 'home:home' %}" class="nav-brand">
      <img
        src="{% static 'images/logo.png' %}"
        alt="Logo"
        class="nav-logo"
        width="36"
        height="36"
      />
      <span class="nav-brand-text">Saint</span>
    </a>
  </div>
  <div class="nav-btn">
    <label for="nav-check">
      <span></span>
      <span></span>
      <span></span>
    </label>
  </div>

  <div class="nav-links">
    <div class="theme-dropdown">
      <button class="theme-toggle" aria-label="Change theme">
        <span class="theme-toggle-icon">🖥️</span>
      </button>
      <div class="theme-menu">
        <button class="theme-option" data-theme="light">☀️ Light</button>
        <button class="theme-option" data-theme="dark">🌙 Dark</button>
        <button class="theme-option" data-theme="system">🖥️ System</button>
      </div>
    </div>
    <a href="{% url 'polls:polls' %}">Polls</a>
    {% if user.is_authenticated %}
    <a href="{% url 'users:logout' %}">Logout</a>
    {% else %}
    <a href="{% url 'users:signup' %}">Sign Up</a>
    {% endif %}
  </div>
</div>
